name: pg_derma
description: Offline-first encrypted PG companion for MD Dermatology (DVL) residents.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  # Encrypted local database
  drift: ^2.20.0
  sqlite3: ^2.4.6
  sqlcipher_flutter_libs: ^0.6.4
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.4.2
  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  # Camera, image & on-device ML
  camera: ^0.11.0+2
  image: ^4.2.0
  google_mlkit_face_detection: ^0.11.0
  google_mlkit_text_recognition: ^0.13.1
  # Export & sharing
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  speech_to_text: ^7.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
