name: Flutter app (build, test, APK)
on:
  push:
    branches: [main]
    paths: ['flutter/**', '.github/workflows/flutter.yml']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: flutter
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platform folders
        run: |
          flutter create . --org com.pgderma --project-name pg_derma --platforms android,ios 2>&1 | tail -5
          python3 tool/platform_setup.py
      - name: Dependencies
        run: flutter pub get 2>&1 | tee ../ci-pub.log
      - name: Code generation (Drift)
        run: dart run build_runner build --delete-conflicting-outputs 2>&1 | tee ../ci-codegen.log
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../ci-analyze.log; exit ${PIPESTATUS[0]}
      - name: Unit tests
        run: flutter test 2>&1 | tee ../ci-test.log; exit ${PIPESTATUS[0]}
      - name: Build APK
        run: flutter build apk --release 2>&1 | tee ../ci-build.log; exit ${PIPESTATUS[0]}
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ../PG-Derma.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-latest
          name: PG Derma Android (latest build)
          prerelease: true
          make_latest: false
          body: |
            Automatic Android build of the Flutter app from commit ${{ github.sha }}.
            Install: download PG-Derma.apk on your Android phone and open it (allow "install unknown apps").
            The web app at https://osmosis0415-a11y.github.io/pg-derma-companion/ remains the main, fully tested version.
          files: PG-Derma.apk
      - name: Report failure as an issue comment
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        working-directory: .
        run: |
          {
            echo "### Flutter CI failed on ${GITHUB_SHA::7}"
            for f in ci-pub ci-codegen ci-analyze ci-test ci-build; do
              [ -f $f.log ] || continue
              echo; echo "<details><summary>$f</summary>"; echo; echo '```'
              grep -E "error|Error|ERROR|warning •|FAILED|Exception|undefined|isn't|can't|must|expected" $f.log | head -120
              echo '```'; echo "</details>"
            done
          } > report.md
          num=$(gh issue list --label ci-flutter --state open --json number -q '.[0].number')
          if [ -z "$num" ]; then gh label create ci-flutter --color B60205 2>/dev/null || true; gh issue create --title "Flutter CI failures" --label ci-flutter --body-file report.md; else gh issue comment "$num" --body-file report.md; fi
      - name: Close failure issue on success
        if: success()
        env: { GH_TOKEN: '${{ github.token }}' }
        working-directory: .
        run: |
          num=$(gh issue list --label ci-flutter --state open --json number -q '.[0].number')
          [ -n "$num" ] && gh issue close "$num" --comment "✅ Fixed in ${GITHUB_SHA::7} — APK published under Releases → android-latest." || true
