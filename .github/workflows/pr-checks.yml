name: PR checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build single-file app
        run: python web/build.py
      - name: Syntax check
        run: node --check dist/bundle-check.js
      - name: Unit-test scoring engines
        run: node web/test/scores.test.js
      - name: Unit-test approval bot
        run: node web/test/admin-bot.test.js
      - name: Other unit tests (*.test.js added by the team)
        run: |
          for t in web/test/*.test.js; do
            case "$t" in */scores.test.js|*/admin-bot.test.js) continue;; esac
            echo "== $t"; node "$t"
          done
