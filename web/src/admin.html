<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PG Derma — Admin console</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0B7A75">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#F4F7F8;--card:#fff;--ink:#0F1B2D;--mut:#5d6b78;--line:#e3e8ec;--acc:#0B7A75;--accs:#E8F6F5;--coral:#F2735B;--red:#dc2626;--green:#16a34a;--amber:#d97706;--grad:linear-gradient(135deg,#0B7A75 0%,#14A3A0 55%,#F2735B 100%)}
*{box-sizing:border-box}body{margin:0;font:14.5px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--acc)}button{font:inherit;cursor:pointer}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--grad)}
.lcard{background:#fff;border-radius:22px;padding:34px 28px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.lcard img{width:76px;height:76px;border-radius:18px}.lcard h1{margin:14px 0 4px;font-size:24px}.lcard p{color:var(--mut);margin:0 0 22px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:600;font-size:15px}
.gbtn:hover{background:#f8fafc}.err{color:var(--red);font-size:13px;margin-top:12px}.note{font-size:12px;color:var(--mut);margin-top:18px}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:#0F1B2D;color:#cbd5e1;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:16px;padding:4px 8px 16px}aside .brand img{width:32px;height:32px;border-radius:9px}
aside a{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#cbd5e1;text-decoration:none;padding:9px 12px;border-radius:10px;font-weight:500}
aside a.on,aside a:hover{background:rgba(255,255,255,.08);color:#fff}aside a.on{box-shadow:inset 3px 0 0 var(--coral)}
aside .cnt{background:var(--coral);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
aside .me{margin-top:auto;font-size:12px;padding:10px 8px;border-top:1px solid rgba(255,255,255,.1)}aside .me button{margin-top:6px;background:none;border:1px solid rgba(255,255,255,.2);color:#cbd5e1;border-radius:8px;padding:5px 10px}
main{padding:24px 28px;max-width:1200px;width:100%}
h2{margin:0 0 4px;font-size:22px}.sub{color:var(--mut);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stat b{display:block;font-size:26px}.stat small{color:var(--mut)}.stat.hot{border-color:var(--coral);background:#fff6f4}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);background:#fafbfc}
tr:last-child td{border-bottom:0}td small{color:var(--mut);display:block}
.b{border:0;border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px;background:var(--acc);color:#fff}.b.g{background:var(--accs);color:var(--acc)}.b.r{background:#fff;color:var(--red);border:1px solid #f3c4c4}.b.rr{background:var(--red);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accs);color:var(--acc)}.tag.c{background:#fff1ed;color:#c2410c}.tag.q{background:#eef2ff;color:#4338ca}
.post img{max-width:280px;max-height:220px;border-radius:10px;display:block;margin-top:8px}.pre{white-space:pre-line}
ol.opts{margin:6px 0 6px 18px;padding:0}ol.opts li.ok{color:var(--green);font-weight:700}
textarea,input{width:100%;font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px}
.dg{display:grid;grid-template-columns:220px 1fr;gap:14px}.dg img{width:100%;max-height:200px;object-fit:cover;border-radius:10px;background:#eef2f4}.dg .noimg{height:120px;border-radius:10px;background:var(--accs);display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:700}
.credit{font-size:11px;color:var(--mut);margin-top:4px}.kp{margin:6px 0 6px 18px;padding:0}.take{background:var(--accs);border-radius:10px;padding:8px 10px;margin-top:6px}
.frm label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sw{display:flex;align-items:center;gap:8px}.sw input{width:auto}
@media (max-width:820px){.dg{grid-template-columns:1fr}.frm .two{grid-template-columns:1fr}}
.muted{color:var(--mut)}.empty{padding:26px;text-align:center;color:var(--mut)}

.dlg{position:fixed;inset:0;background:rgba(15,27,45,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}.dlgb{background:#fff;border-radius:14px;padding:18px;max-width:380px;width:100%}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0F1B2D;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}#toast.on{opacity:1}
.mtop{display:none}
@media (max-width:820px){.shell{grid-template-columns:1fr}aside{position:fixed;inset:0 30% 0 0;z-index:20;transform:translateX(-100%);transition:.2s;height:100%}aside.open{transform:none}
 .mtop{display:flex;align-items:center;gap:10px;background:#0F1B2D;color:#fff;padding:10px 14px;position:sticky;top:0;z-index:10}.mtop button{background:none;border:0;color:#fff;font-size:22px}.mtop img{width:26px;height:26px;border-radius:7px}
 main{padding:16px}table,thead,tbody,tr,td,th{display:block}thead{display:none}tr{border-bottom:1px solid var(--line);padding:6px 0}td{border:0;padding:4px 12px}}
</style></head>
<body>
<div id="app"><div class="login"><div class="lcard"><img src="icon.svg" alt=""><h1>Admin console</h1><p>PG Derma Companion</p><p class="muted">Loading…</p></div></div></div>
<div id="toast"></div>
<script>
/*CONFIG*/
const ADMIN_EMAILS = ['sriramdeverashetty@gmail.com'];
const FB_VER = '10.12.2';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600); };
const ms = x => !x ? 0 : x.toMillis ? x.toMillis() : x.seconds ? x.seconds * 1000 : typeof x === 'number' ? x : Date.parse(x) || 0;
const when = x => { const t = ms(x); if (!t) return ''; const s = (Date.now() - t) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + ' min ago' : s < 86400 ? Math.floor(s / 3600) + ' h ago' : new Date(t).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const ini = n => String(n || '?').split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const TYPES = { mcq: 'MCQ', card: 'Flashcard', spot: 'Spot diagnosis', pearl: 'One-liner' };
let LAYOUT = 'insta', F = {}, auth, db, user, view = location.hash.slice(1) || 'overview';
const confirmBox = m => new Promise(res => { const d = document.createElement('div'); d.className = 'dlg'; d.innerHTML = `<div class="dlgb"><p>${esc(m)}</p><div class="row" style="justify-content:flex-end"><button class="b g" data-r="0">Cancel</button><button class="b rr" data-r="1">OK</button></div></div>`; document.body.appendChild(d); d.onclick = e => { const b = e.target.closest('[data-r]'); if (!b && e.target !== d) return; d.remove(); res(!!b && b.dataset.r === '1'); }; });

async function boot() {
  const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
  const [A, Au, Fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  F = Object.assign({}, Au, Fs); const app = A.initializeApp(window.FIREBASE_CONFIG, 'admin');
  auth = Au.getAuth(app); db = Fs.getFirestore(app);
  Au.onAuthStateChanged(auth, u => { user = u; u && ADMIN_EMAILS.includes((u.email || '').toLowerCase()) && u.emailVerified ? shell() : login(u); });
}
function login(u, err) {
  $('#app').innerHTML = `<div class="login"><div class="lcard"><img src="icon.svg" alt=""><h1>Admin console</h1><p>PG Derma Companion</p>
    ${u ? `<p class="err">${esc(u.email)} is not an admin account.</p>` : ''}
    <button class="gbtn" id="gsign"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>${u ? 'Use another Google account' : 'Sign in with Google'}</button>
    ${err ? `<p class="err">${esc(err)}</p>` : ''}<p class="note">Only the admin Google account can open this console. Everyone else uses the app.</p></div></div>`;
  $('#gsign').onclick = async () => {
    try { if (u) await F.signOut(auth); const p = new F.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); await F.signInWithPopup(auth, p); }
    catch (e) { if (e.code !== 'auth/popup-closed-by-user') login(null, e.code === 'auth/unauthorized-domain' ? 'This site is not authorised in Firebase Authentication.' : (e.message || 'Sign-in failed')); }
  };
}
const NAV = [['overview', 'Overview'], ['users', 'Users'], ['content', 'Study content'], ['digest', 'Journal digest'], ['reports', 'Reports'], ['posts', 'Community posts'], ['batches', 'Batches'], ['reminders', 'Study reminders'], ['errors', 'Errors'], ['links', 'Tools & links']];
let counts = {};
function shell() {
  $('#app').innerHTML = `<div class="mtop"><button id="mnav" aria-label="Menu">☰</button><img src="icon.svg" alt=""><b>Admin</b></div><div class="shell"><aside id="side"><div class="brand"><img src="icon.svg" alt="">PG Derma Admin</div>
    ${NAV.map(([k, l]) => `<a href="#${k}" data-v="${k}">${l}<span class="cnt" id="n_${k}" hidden></span></a>`).join('')}
    <div class="me">${esc(user.email)}<br><a href="./" style="padding:6px 0;color:#99f6e4">Open the app ↗</a><button id="out">Sign out</button></div></aside><main id="main"></main></div>`;
  $('#out').onclick = () => F.signOut(auth); $('#mnav').onclick = () => $('#side').classList.toggle('open');
  window.onhashchange = () => { view = location.hash.slice(1) || 'overview'; $('#side').classList.remove('open'); render(); };
  refreshCounts(); render();
}
document.addEventListener('click', async e => { const b = e.target.closest('[data-lay]'); if (!b) return; await F.setDoc(F.doc(db, 'config', 'app'), { layout: b.dataset.lay, updatedAt: F.serverTimestamp() }, { merge: true }); LAYOUT = b.dataset.lay; toast(LAYOUT === 'twitter' ? 'Twitter / X style is on for everyone' : 'Instagram style is on for everyone'); render(); });
function setCount(k, n) { counts[k] = n; const e = $('#n_' + k); if (e) { e.hidden = !n; e.textContent = n; } }
async function q(coll, ...m) { return (await F.getDocs(m.length ? F.query(F.collection(db, coll), ...m) : F.collection(db, coll))).docs.map(d => Object.assign({ id: d.id, _ref: d.ref }, d.data())); }
async function refreshCounts() {
  try { setCount('users', (await q('approvals', F.where('status', '==', 'pending'))).length); } catch (e) {}
  try { setCount('content', (await q('content', F.where('status', '==', 'draft'))).length); } catch (e) {}
  try { setCount('digest', (await q('digest', F.where('status', '==', 'draft'))).length); } catch (e) {}
  try { setCount('reports', (await q('reports')).length); } catch (e) {}
  try { setCount('errors', (await q('errors', F.orderBy('createdAt', 'desc'), F.limit(50))).filter(x => Date.now() - ms(x.createdAt) < 864e5).length); } catch (e) {}
}
function render() {
  $$('aside a[data-v]').forEach(a => a.classList.toggle('on', a.dataset.v === view));
  const m = $('#main'); m.innerHTML = '<p class="muted">Loading…</p>';
  ({ overview: vOverview, users: vUsers, content: vContent, digest: vDigest, reports: vReports, posts: vPosts, batches: vBatches, reminders: vReminders, errors: vErrors, links: vLinks }[view] || vOverview)(m)
    .catch(e => { m.innerHTML = `<div class="card"><b>Could not load.</b><p class="muted">${esc(e.code || e.message)}</p></div>`; });
}
/* ---------- Overview ---------- */
async function vOverview(m) {
  const [ap, ct, rp, ps, bt, st, pr] = await Promise.all([q('approvals'), q('content'), q('reports'), q('posts', F.orderBy('createdAt', 'desc'), F.limit(200)).catch(() => []), q('batches'), q('study').catch(() => []), q('profiles').catch(() => [])]);
  try { const cf = await F.getDoc(F.doc(db, 'config', 'app')); LAYOUT = (cf.exists() && cf.data().layout) || 'insta'; } catch (e) {}
  const day = Date.now() - 864e5, week = Date.now() - 7 * 864e5, today = new Date(Date.now() + 5.5 * 36e5).toISOString().slice(0, 10);
  const S = (n, l, hot, href) => `<a class="stat${hot ? ' hot' : ''}" href="${href ? '#' + href : 'javascript:void 0'}" style="text-decoration:none;color:inherit"><b>${n}</b><small>${l}</small></a>`;
  m.innerHTML = `<h2>Overview</h2><p class="sub">Everything that needs your attention, at a glance.</p>
    <div class="stats">${S(ap.filter(x => x.status === 'pending').length, 'sign-ups waiting', ap.some(x => x.status === 'pending'), 'users')}${S(ct.filter(x => x.status === 'draft').length, 'study drafts to review', ct.some(x => x.status === 'draft'), 'content')}${S(counts.digest || 0, 'journal posts to review', counts.digest, 'digest')}${S(rp.length, 'reported posts', rp.length, 'reports')}${S(ap.filter(x => x.status === 'approved').length, 'approved users', 0, 'users')}</div>
    <div class="stats">${S(ps.filter(p => ms(p.createdAt) > day).length, 'posts today', 0, 'posts')}${S(ps.filter(p => ms(p.createdAt) > week).length, 'posts this week', 0, 'posts')}${S(st.filter(s => s.last === today).length, 'studied today', 0, 'reminders')}${S(ct.filter(x => x.status === 'live').length, 'published bot items', 0, 'content')}${S(bt.length, 'batches', 0, 'batches')}${S(pr.length, 'community profiles', 0)}</div>
    <div class="card"><h3 style="margin-top:0">App style</h3><p class="muted">Choose how the Community feed looks for every resident.</p><div class="row"><button class="b ${LAYOUT !== 'twitter' ? '' : 'g'}" data-lay="insta">📸 Instagram style</button><button class="b ${LAYOUT === 'twitter' ? '' : 'g'}" data-lay="twitter">𝕏 Twitter / X style</button></div></div>
    <div class="card"><h3 style="margin-top:0">Recent sign-ups</h3>${ap.sort((a, b) => ms(b.requestedAt) - ms(a.requestedAt)).slice(0, 6).map(x => `<div class="row between" style="padding:6px 0;border-top:1px solid var(--line)"><span><b>${esc(x.name || x.email)}</b> <small class="muted">${esc(x.email)}</small></span><span class="tag ${x.status === 'pending' ? 'c' : ''}">${esc(x.status)}</span></div>`).join('') || '<p class="muted">None yet.</p>'}</div>`;
}
/* ---------- Users ---------- */
let utab = 'pending';
async function vUsers(m) {
  const all = await q('approvals'); const list = all.filter(x => x.status === utab).sort((a, b) => ms(b.requestedAt) - ms(a.requestedAt));
  const c = s => all.filter(x => x.status === s).length; setCount('users', c('pending'));
  m.innerHTML = `<h2>Users</h2><p class="sub">Approve sign-ups, call anyone, switch batch calling on or off, revoke access. Calls open in the app (unlock with your PIN), and ring the person if their app is open.</p>
    <div class="tabs">${['pending', 'approved', 'rejected'].map(s => `<button data-t="${s}" class="${s === utab ? 'on' : ''}">${s[0].toUpperCase() + s.slice(1)} (${c(s)})</button>`).join('')}</div>
    ${list.length ? `<table><thead><tr><th>Person</th><th>Requested</th><th>Calls</th><th></th></tr></thead><tbody>${list.map(x => `<tr><td><b>${esc(x.name || '—')}</b><small>${esc(x.email)}</small><small>${esc([x.year, x.college].filter(Boolean).join(' · '))}${x.ref ? ' · referred by ' + esc((all.find(y => y.id.slice(0, 8) === x.ref) || {}).name || x.ref) : ''}</small></td><td>${esc(when(x.requestedAt))}</td>
      <td>${x.status === 'approved' ? `<button class="b ${x.calls ? '' : 'g'}" data-calls="${x.id}" data-on="${x.calls ? 1 : 0}">${x.calls ? 'On' : 'Off'}</button>` : '—'}</td>
      <td class="row">${x.status === 'approved' && !ADMIN_EMAILS.includes((x.email || '').toLowerCase()) ? `<a class="b" style="text-decoration:none" href="./#/admin?t=approved&dial=${x.id}&v=0" target="pgdermaapp">📞 Call</a><a class="b" style="text-decoration:none" href="./#/admin?t=approved&dial=${x.id}&v=1" target="pgdermaapp">🎥 Video</a>` : ''}${x.status !== 'approved' ? `<button class="b" data-set="approved" data-id="${x.id}">Approve</button>` : ''}${x.status === 'pending' ? `<button class="b r" data-set="rejected" data-id="${x.id}">Reject</button>` : ''}${x.status === 'approved' && !ADMIN_EMAILS.includes((x.email || '').toLowerCase()) ? `<button class="b r" data-set="rejected" data-id="${x.id}">Revoke</button>` : ''}${x.status === 'rejected' ? `<button class="b g" data-del="${x.id}">Remove</button>` : ''}</td></tr>`).join('')}</tbody></table>` : `<div class="card empty">No ${utab} users.</div>`}`;
  $$('[data-t]').forEach(b => b.onclick = () => { utab = b.dataset.t; render(); });
  $$('[data-set]').forEach(b => b.onclick = async () => { if (b.dataset.set === 'rejected' && !confirmBox(b.textContent + ' this person?')) return; await F.updateDoc(F.doc(db, 'approvals', b.dataset.id), { status: b.dataset.set, decidedAt: F.serverTimestamp(), decidedBy: user.email }); const x = all.find(y => y.id === b.dataset.id); if (b.dataset.set === 'approved' && x && x.ref) { const r = all.find(y => y.id.slice(0, 8) === x.ref && y.id !== x.id); if (r) await F.addDoc(F.collection(db, 'notifs'), { to: r.id, from: user.uid, fromName: (x.name || x.email).slice(0, 80), type: 'refer', ref: x.id, text: '', at: F.serverTimestamp(), read: false, pushed: false }).catch(() => {}); } toast('Done'); render(); });
  $$('[data-calls]').forEach(b => b.onclick = async () => { const on = b.dataset.on !== '1'; await F.updateDoc(F.doc(db, 'approvals', b.dataset.calls), { calls: on }); toast(on ? 'Calls switched on' : 'Calls switched off'); render(); });
  $$('[data-del]').forEach(b => b.onclick = async () => { if (!(await confirmBox('Remove this record? They can request again.'))) return; await F.deleteDoc(F.doc(db, 'approvals', b.dataset.del)); render(); });
}
/* ---------- Study content ---------- */
let ctab = 'draft';
function itemHTML(x) {
  if (x.t === 'mcq') return `<b>${esc(x.q)}</b><ol class="opts" type="A">${(x.o || []).map((o, i) => `<li class="${i === +x.a ? 'ok' : ''}">${esc(o)}</li>`).join('')}</ol><div class="muted">${esc(x.x || '')}</div>${x.r ? `<small class="muted">${esc(x.r)}</small>` : ''}`;
  if (x.t === 'card') return `<b>${esc(x.f)}</b><div class="pre muted">${esc(x.b)}</div>`;
  if (x.t === 'spot') return `<div>${esc(x.v)}</div><b>→ ${esc(x.dx)}</b><div class="muted">${esc(x.x || '')}</div>`;
  return `<div>${esc(x.p)}</div>`;
}
const CF = { mcq: [['q', 'Question'], ['o', 'Options (one per line)'], ['a', 'Correct letter'], ['x', 'Explanation'], ['r', 'Reference']], card: [['f', 'Front'], ['b', 'Back']], spot: [['v', 'Vignette'], ['dx', 'Diagnosis'], ['x', 'Explanation']], pearl: [['p', 'One-liner']] };
async function vContent(m) {
  const all = await q('content'), list = all.filter(x => x.status === ctab).sort((a, b) => ms(b.createdAt) - ms(a.createdAt));

async function vReports(m) {

  const rows = []; for (const pid of Object.keys(by)) { let p = null; try { const d = await F.getDoc(F.doc(db, 'posts', pid)); if (d.exists()) p = Object.assign({ id: pid }, d.data()); } catch (e) {} rows.push({ pid, p, rs: by[pid] }); }
  m.innerHTML = `<h2>Reports</h2><p class="sub">Posts members flagged. Delete the post, dismiss, or revoke the author.</p>${rows.map(o => `<div class="card"><p><b>${o.rs.length} report(s):</b> ${o.rs.map(r => esc(r.reason || '—')).join(' · ')}</p>${o.p ? postHTML(o.p) : '<p class="muted">Post already deleted.</p>'}
    <div class="row" style="margin-top:10px">${o.p ? `<button class="b rr" data-rdel="${o.pid}">Delete post</button><button class="b r" data-rev="${esc(o.p.uid)}" data-n="${esc(o.p.name)}">Revoke author</button>` : ''}<button class="b g" data-dis="${o.rs.map(r => r.id).join(',')}">Dismiss</button></div></div>`).join('') || '<div class="card empty">No reports. 🎉</div>'}`;
  $$('[data-rdel]').forEach(b => b.onclick = async () => { if (!(await confirmBox('Delete this post for everyone?'))) return; await delPost(b.dataset.rdel); for (const r of by[b.dataset.rdel]) await F.deleteDoc(F.doc(db, 'reports', r.id)); toast('Deleted'); render(); });
  $$('[data-dis]').forEach(b => b.onclick = async () => { for (const id of b.dataset.dis.split(',')) await F.deleteDoc(F.doc(db, 'reports', id)); toast('Dismissed'); render(); });
  $$('[data-rev]').forEach(b => b.onclick = () => revoke(b.dataset.rev, b.dataset.n));
}
async function vPosts(m) {
  const ps = await q('posts', F.orderBy('createdAt', 'desc'), F.limit(100));
  m.innerHTML = `<h2>Community posts</h2><p class="sub">Latest 100 posts from all residents.</p>${ps.map(p => `<div class="card">${postHTML(p)}<div class="row" style="margin-top:10px"><a class="b g" href="./#/post/${p.id}" target="_blank" style="text-decoration:none">Open in app</a><button class="b r" data-pdel="${p.id}">Delete</button><button class="b r" data-rev="${esc(p.uid)}" data-n="${esc(p.name)}">Revoke author</button></div></div>`).join('') || '<div class="card empty">No posts yet.</div>'}`;
  $$('[data-pdel]').forEach(b => b.onclick = async () => { if (!(await confirmBox('Delete this post for everyone?'))) return; await delPost(b.dataset.pdel); toast('Deleted'); render(); });
  $$('[data-rev]').forEach(b => b.onclick = () => revoke(b.dataset.rev, b.dataset.n));
}
/* ---------- Batches ---------- */
async function vBatches(m) {
  const bs = await q('batches'); const rows = await Promise.all(bs.map(async b => { let mem = [], msgs = 0; try { mem = await q('batches/' + b.id + '/members'); } catch (e) {} try { msgs = (await F.getDocs(F.collection(db, 'batches', b.id, 'messages'))).size; } catch (e) {} return { b, mem, msgs }; }));
  m.innerHTML = `<h2>Batches</h2><p class="sub">Every batch group in the app. To delete a batch with its chat and calendar, use Admin → Batches in the app.</p>
    ${rows.length ? `<table><thead><tr><th>Batch</th><th>Code</th><th>Members</th><th>Messages</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${esc(r.b.name || r.b.id)}</b><small>${esc(r.b.college || '')}</small></td><td><code>${esc(r.b.id)}</code></td><td>${r.mem.length}<small>${esc(r.mem.map(x => x.name).join(', '))}</small></td><td>${r.msgs}</td></tr>`).join('')}</tbody></table>` : '<div class="card empty">No batches yet.</div>'}`;
}
/* ---------- Study reminders ---------- */
async function vReminders(m) {
  const st = await q('study'), today = new Date(Date.now() + 5.5 * 36e5).toISOString().slice(0, 10);
  m.innerHTML = `<h2>Study activity & reminders</h2><p class="sub">Who is studying, their streaks and reminder settings. The bot emails reminders only on days they haven't met their goal.</p>
    ${st.length ? `<table><thead><tr><th>Resident</th><th>Streak</th><th>Last studied</th><th>Goal</th><th>Reminder</th></tr></thead><tbody>${st.sort((a, b) => (b.streak || 0) - (a.streak || 0)).map(s => `<tr><td><b>${esc(s.name || '—')}</b><small>${esc(s.email || '')}</small></td><td>${s.streak || 0} 🔥</td><td>${esc(s.last === today ? 'Today' : s.last || '—')}</td><td>${s.goal || 10}/day</td><td>${s.remind ? 'On · ' + ((s.hour % 12) || 12) + (s.hour < 12 ? ' am' : ' pm') : 'Off'}</td></tr>`).join('')}</tbody></table>` : '<div class="card empty">No study activity synced yet.</div>'}`;
}
/* ---------- Errors ---------- */
async function vErrors(m) {
  const es = await q('errors', F.orderBy('createdAt', 'desc'), F.limit(100));
  m.innerHTML = `<h2>Errors</h2><p class="sub">App crashes and call failures reported automatically (no patient data).</p>${es.length ? `<table><thead><tr><th>When</th><th>Type</th><th>Message</th><th>Screen</th></tr></thead><tbody>${es.map(e => `<tr><td>${esc(when(e.createdAt || e.at))}</td><td><span class="tag ${e.type === 'calls' ? 'q' : 'c'}">${esc(e.type)}</span></td><td>${esc((e.msg || '').slice(0, 220))}<small>${esc(e.version || '')}</small></td><td>${esc(e.route || '')}</td></tr>`).join('')}</tbody></table><p><button class="b r" id="eclear">Clear all errors</button></p>` : '<div class="card empty">No errors. 🎉</div>'}`;
  const c = $('#eclear'); if (c) c.onclick = async () => { if (!(await confirmBox('Delete all error reports?'))) return; for (const e of es) await F.deleteDoc(F.doc(db, 'errors', e.id)); toast('Cleared'); setCount('errors', 0); render(); };
}
